<div class="shell">
  <nav class="navbar">
    <a routerLink="/" class="logo">PIXELPAWN</a>
    <span class="tagline">RETRO GAME EXCHANGE</span>
    <span class="spacer"></span>
    <ng-container *ngIf="!tokenStorage.isLoggedIn(); else loggedIn">
      <a routerLink="/login">Login</a>
      <a routerLink="/register">Register</a>
    </ng-container>
    <ng-template #loggedIn>
      <span class="hello">Player: {{ tokenStorage.getName() }}</span>
      <a (click)="logout()" style="cursor:pointer">Logout</a>
    </ng-template>
  </nav>

  <main class="page" [class.page-auth]="authScreen">
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer">
    <p>Mohammad Ismail Hossain J. Khan • ITS152P • 2026</p>
  </footer>
</div>
