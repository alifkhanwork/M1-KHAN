<section class="auth-stage">
  <div class="telemetry">
    <span>SERVER STATUS: ONLINE</span>
    <span>VERSION: v1.0.4-RELEASE</span>
  </div>

  <div class="cabinet">
    <div class="auth-card">
      <p class="auth-kicker">PIXELPAWN // ARCADE TERMINAL</p>
      <h2>PLAYER LOGIN</h2>
      <form (ngSubmit)="onSubmit()">
        <label for="username">Username</label>
        <input id="username" name="username" [(ngModel)]="form.username" maxlength="16" placeholder="PLAYER ID" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="form.password" maxlength="16" placeholder="PASSCODE" required />
        <button class="arcade" type="submit">START</button>
        <p class="error" *ngIf="error">{{ error }}</p>
      </form>
      <p class="auth-switch">NEW PLAYER? <a routerLink="/register">CREATE AN ACCOUNT</a></p>
    </div>
  </div>
</section>
