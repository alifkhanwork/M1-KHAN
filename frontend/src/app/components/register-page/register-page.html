<section class="auth-stage">
  <div class="telemetry">
    <span>SERVER STATUS: ONLINE</span>
    <span>VERSION: v1.0.4-RELEASE</span>
  </div>

  <div class="cabinet">
    <div class="auth-card">
      <p class="auth-kicker">PIXELPAWN // NEW SAVE FILE</p>
      <h2>NEW PLAYER</h2>
      <form (ngSubmit)="onSubmit()">
        <label for="userName">Username</label>
        <input id="userName" name="u" [(ngModel)]="form.userName" maxlength="16" placeholder="PLAYER ID" required />
        <label for="reg-password">Password</label>
        <input id="reg-password" name="p" type="password" [(ngModel)]="form.password" maxlength="16" placeholder="PASSCODE" required />
        <label for="firstName">First Name</label>
        <input id="firstName" name="f" [(ngModel)]="form.firstName" placeholder="FIRST" required />
        <label for="lastName">Last Name</label>
        <input id="lastName" name="l" [(ngModel)]="form.lastName" placeholder="LAST" required />
        <button class="arcade" type="submit">REGISTER</button>
        <p class="error" *ngIf="error">{{ error }}</p>
      </form>
      <p class="auth-switch">ALREADY HAVE A SAVE FILE? <a routerLink="/login">LOG IN</a></p>
    </div>
  </div>
</section>
